1. Implement feature across relevant files (HTML, JS, README, etc.)
2. Commit initial implementation
3. Review code (internally or via automated tools like CodeQL)
4. Address review findings: fix bugs, improve security, clarify comments, update documentation
5. Commit fixes and improvements

