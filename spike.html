<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wallcast – Spike Test</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Courier New', monospace;
  background: #0e0e0e;
  color: #c9d1d9;
  padding: 28px 24px;
  line-height: 1.7;
}
h1 { color: #fff; font-size: 20px; margin-bottom: 4px; }
.sub { font-size: 13px; color: #8b949e; margin-bottom: 20px; }
button {
  padding: 10px 22px;
  background: #238636;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  margin-bottom: 20px;
}
button:hover { background: #2ea043; }
button:disabled { background: #3a3a3a; cursor: not-allowed; }
#log { font-size: 13px; white-space: pre-wrap; }
.pass  { color: #3fb950; }
.fail  { color: #f85149; }
.info  { color: #8b949e; }
.head  { color: #e3b341; }
.send  { color: #79c0ff; }
</style>
</head>
<body>
<h1>Wallcast — Spike Test</h1>
<p class="sub">Validates chunking + backpressure against a mocked DataChannel (10 concurrent senders, 2–5 MB each) plus DoS abuse cases. Real-device LAN test (2+ phones) is the acceptance gate.</p>

<button id="run-btn" onclick="runSpike()">▶ Run Spike (10 senders)</button>
<div id="log"></div>

<script>
'use strict';

// ── Spike parameters ──────────────────────────────────────────────────────────
const N_SENDERS   = 10;
const SIZES_MB    = [2.0, 3.0, 2.5, 4.0, 3.5, 2.0, 5.0, 3.0, 4.5, 2.5];

// AIDEV- match production constants so the spike proves the real primitives
const CHUNK_SIZE          = 16 * 1024;       // 16 KB
const BACKPRESSURE_PAUSE  = 1024 * 1024;     // 1 MB  — sender pauses
const BACKPRESSURE_RESUME = 256  * 1024;     // 256 KB — sender resumes

// AIDEV- DoS caps, must match wall.html handleChunk
const MAX_PHOTO_BYTES       = 8 * 1024 * 1024;
const MAX_CHUNKS            = 512;
const MAX_PENDING_PER_GUEST = 2;

// ── DOM log helper ────────────────────────────────────────────────────────────
function log(msg, cls = 'info') {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = msg;
  document.getElementById('log').appendChild(el);
}

function logRaw(html) {
  const el = document.createElement('div');
  el.innerHTML = html;
  document.getElementById('log').appendChild(el);
}

// ── MockDataChannel ───────────────────────────────────────────────────────────
// AIDEV- simulates RTCDataChannel bufferedAmount mechanics in-memory so
// backpressure logic can be verified without a real network or PeerJS server.
// Messages are delivered asynchronously (latencyMs jitter) to mirror real behaviour.
class MockDataChannel {
  constructor(receiveCallback, latencyMs = 1) {
    this.bufferedAmount = 0;
    this._q       = [];
    this._cb      = receiveCallback;
    this._latency = latencyMs;
    this._run();
  }

  _run() {
    // Process one message per tick to simulate async delivery
    const tick = () => {
      if (this._q.length) {
        const msg   = this._q.shift();
        const bytes = (msg.data instanceof ArrayBuffer) ? msg.data.byteLength : 128;
        // Drain bufferedAmount as data is "sent"
        this.bufferedAmount = Math.max(0, this.bufferedAmount - bytes);
        this._cb(msg);
      }
      setTimeout(tick, this._latency);
    };
    setTimeout(tick, this._latency);
  }

  send(msg) {
    const bytes = (msg.data instanceof ArrayBuffer) ? msg.data.byteLength : 128;
    this.bufferedAmount += bytes;
    this._q.push(msg);
  }
}

// ── Receiver (wall side) ──────────────────────────────────────────────────────
// AIDEV- mirrors wall.html handleChunk: per-guest pendingMap keys, size/chunk
// caps with 'photo-rejected' semantics, duplicate-index guard, byte-overrun abort.
class PhotoReceiver {
  constructor() {
    this.pending  = new Map();   // `${peer}|${id}` → transfer state
    this.received = [];
    this.rejected = [];          // { id, reason, peer }
  }

  _key(peer, id) { return peer + '|' + id; }

  _guestPendingCount(peer) {
    let n = 0;
    for (const p of this.pending.values()) if (p.peer === peer) n++;
    return n;
  }

  handle(msg) {
    const peer = msg.__peer || 'anon';

    if (msg.type === 'photo-start') {
      const sane = Number.isInteger(msg.size) && msg.size > 0 &&
                   Number.isInteger(msg.totalChunks) && msg.totalChunks > 0;
      if (!sane || msg.size > MAX_PHOTO_BYTES || msg.totalChunks > MAX_CHUNKS) {
        this.rejected.push({ id: msg.id, reason: 'too-large', peer });
        return;
      }
      if (this._guestPendingCount(peer) >= MAX_PENDING_PER_GUEST) {
        this.rejected.push({ id: msg.id, reason: 'busy', peer });
        return;
      }
      // AIDEV- sparse array pre-sized to totalChunks for O(1) indexed writes
      this.pending.set(this._key(peer, msg.id), {
        chunks:        new Array(msg.totalChunks),
        totalChunks:   msg.totalChunks,
        received:      0,
        receivedBytes: 0,
        size:          msg.size,
        peer
      });

    } else if (msg.type === 'photo-chunk') {
      const key = this._key(peer, msg.id);
      const p   = this.pending.get(key);
      if (!p) return;
      if (!Number.isInteger(msg.index) || msg.index < 0 || msg.index >= p.totalChunks) return;
      // AIDEV- duplicates must not advance `received`, or an incomplete photo
      // could be treated as complete on photo-end
      if (p.chunks[msg.index] !== undefined) return;
      p.receivedBytes += (msg.data && msg.data.byteLength) || 0;
      if (p.receivedBytes > p.size + CHUNK_SIZE) {
        this.pending.delete(key);
        this.rejected.push({ id: msg.id, reason: 'too-large', peer });
        return;
      }
      // AIDEV- use declared msg.index (not insertion order) to handle potential
      // out-of-order delivery, matching the production wall.html implementation
      p.chunks[msg.index] = msg.data;
      p.received++;

    } else if (msg.type === 'photo-end') {
      const key = this._key(peer, msg.id);
      const p   = this.pending.get(key);
      this.pending.delete(key);

      if (!p || p.received !== p.totalChunks) {
        this.received.push({ id: msg.id, ok: false, reason: 'incomplete' });
        return;
      }

      // Verify total byte count matches declared size; filter out any sparse holes
      const total = p.chunks.reduce((s, c) => s + (c ? c.byteLength : 0), 0);
      this.received.push({ id: msg.id, ok: total === p.size, total, expected: p.size });
    }
  }
}

// ── Sender (guest side) ───────────────────────────────────────────────────────
async function sendPhoto(channel, sizeMB, senderIdx) {
  const size  = Math.round(sizeMB * 1024 * 1024);
  // Create synthetic image-like buffer with a known fill pattern
  const ab    = new ArrayBuffer(size);
  const view  = new Uint8Array(ab);
  const seed  = (senderIdx * 31 + 7) & 0xff;
  for (let i = 0; i < size; i++) view[i] = (seed + i) & 0xff;

  const totalChunks = Math.ceil(size / CHUNK_SIZE);
  const id = 'photo-' + senderIdx + '-' + Math.random().toString(36).slice(2, 8);
  // AIDEV- __peer stands in for conn.peer: on the real wall the sender identity
  // comes from the DataConnection, not from the message payload
  const peer = 'guest-' + senderIdx;

  channel.send({ type: 'photo-start', id, totalChunks, size, __peer: peer });

  for (let i = 0; i < totalChunks; i++) {
    // AIDEV- backpressure: spin-sleep until DataChannel drains below pause threshold
    while (channel.bufferedAmount > BACKPRESSURE_PAUSE) {
      await sleep(20);
    }
    channel.send({
      type:  'photo-chunk',
      id,
      index: i,
      data:  ab.slice(i * CHUNK_SIZE, Math.min((i + 1) * CHUNK_SIZE, size)),
      __peer: peer
    });
  }

  channel.send({ type: 'photo-end', id, __peer: peer });
  return { id, size };
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Abuse-case checks ─────────────────────────────────────────────────────────
// AIDEV- validates the DoS-hardening paths added to wall.html handleChunk:
// oversize photo-start rejection, duplicate-chunk-index guard, per-guest
// pending cap. Runs synchronously against a fresh receiver (no mock latency
// needed — these are pure receiver-logic checks).
function runAbuseChecks() {
  let ok = true;
  const check = (name, cond, detail) => {
    if (cond) log(`  ✅  ${name}`, 'pass');
    else      { log(`  ❌  ${name}${detail ? ' — ' + detail : ''}`, 'fail'); ok = false; }
  };

  // 1. Oversize declaration: 100 MB photo-start must be rejected, no pending entry
  {
    const r = new PhotoReceiver();
    r.handle({ type: 'photo-start', id: 'big', totalChunks: 6400, size: 100 * 1024 * 1024, __peer: 'evil' });
    check('oversize photo-start rejected (too-large)',
      r.rejected.length === 1 && r.rejected[0].reason === 'too-large' && r.pending.size === 0,
      `rejected=${JSON.stringify(r.rejected)} pending=${r.pending.size}`);

    // Non-integer / non-positive fields must also be rejected without allocation
    r.rejected.length = 0;
    r.handle({ type: 'photo-start', id: 'nan', totalChunks: 2.5, size: -1, __peer: 'evil' });
    check('insane size/totalChunks rejected (too-large)',
      r.rejected.length === 1 && r.rejected[0].reason === 'too-large' && r.pending.size === 0);
  }

  // 2. Duplicate chunk index must not complete an incomplete photo
  {
    const r = new PhotoReceiver();
    const chunk = new ArrayBuffer(CHUNK_SIZE);
    r.handle({ type: 'photo-start', id: 'dup', totalChunks: 4, size: 4 * CHUNK_SIZE, __peer: 'g1' });
    r.handle({ type: 'photo-chunk', id: 'dup', index: 0, data: chunk, __peer: 'g1' });
    r.handle({ type: 'photo-chunk', id: 'dup', index: 1, data: chunk, __peer: 'g1' });
    r.handle({ type: 'photo-chunk', id: 'dup', index: 2, data: chunk, __peer: 'g1' });
    r.handle({ type: 'photo-chunk', id: 'dup', index: 2, data: chunk, __peer: 'g1' }); // duplicate, chunk 3 missing
    r.handle({ type: 'photo-end',   id: 'dup', __peer: 'g1' });
    const res = r.received.find(x => x.id === 'dup');
    check('duplicate chunk index does not complete an incomplete photo',
      res && res.ok === false && res.reason === 'incomplete',
      `result=${JSON.stringify(res)}`);
  }

  // 3. Per-guest pending cap: 3rd concurrent photo-start from same guest → busy
  {
    const r = new PhotoReceiver();
    r.handle({ type: 'photo-start', id: 'a', totalChunks: 4, size: 4 * CHUNK_SIZE, __peer: 'g1' });
    r.handle({ type: 'photo-start', id: 'b', totalChunks: 4, size: 4 * CHUNK_SIZE, __peer: 'g1' });
    r.handle({ type: 'photo-start', id: 'c', totalChunks: 4, size: 4 * CHUNK_SIZE, __peer: 'g1' });
    // a different guest must NOT be affected by g1's pending count
    r.handle({ type: 'photo-start', id: 'd', totalChunks: 4, size: 4 * CHUNK_SIZE, __peer: 'g2' });
    check('3rd concurrent transfer from same guest rejected (busy)',
      r.rejected.length === 1 && r.rejected[0].id === 'c' && r.rejected[0].reason === 'busy',
      `rejected=${JSON.stringify(r.rejected)}`);
    check('per-guest cap does not affect other guests',
      r.pending.size === 3,
      `pending=${r.pending.size}`);
  }

  // 4. Byte overrun: guest streams more bytes than declared → transfer aborted
  {
    const r = new PhotoReceiver();
    const chunk = new ArrayBuffer(CHUNK_SIZE);
    r.handle({ type: 'photo-start', id: 'liar', totalChunks: 512, size: 2 * CHUNK_SIZE, __peer: 'g1' });
    for (let i = 0; i < 5; i++) {
      r.handle({ type: 'photo-chunk', id: 'liar', index: i, data: chunk, __peer: 'g1' });
    }
    check('byte overrun beyond declared size aborts transfer (too-large)',
      r.pending.size === 0 && r.rejected.some(x => x.id === 'liar' && x.reason === 'too-large'),
      `pending=${r.pending.size} rejected=${JSON.stringify(r.rejected)}`);
  }

  return ok;
}

// ── Spike runner ──────────────────────────────────────────────────────────────
async function runSpike() {
  document.getElementById('log').innerHTML = '';
  document.getElementById('run-btn').disabled = true;

  log('─────────────────────────────────────────────', 'head');
  log(`Spike: ${N_SENDERS} concurrent senders`, 'head');
  log(`Chunks: ${CHUNK_SIZE / 1024} KB  |  Pause threshold: ${BACKPRESSURE_PAUSE / 1024} KB  |  Resume: ${BACKPRESSURE_RESUME / 1024} KB`, 'info');
  log('─────────────────────────────────────────────', 'head');

  const t0 = performance.now();

  // Single shared channel (all senders → one receiver, proving concurrent interleaving)
  const receiver = new PhotoReceiver();
  const channel  = new MockDataChannel(msg => receiver.handle(msg), 1);

  // Launch all senders concurrently — this is the key test: interleaved chunks
  const results = await Promise.all(
    SIZES_MB.map((mb, i) =>
      sendPhoto(channel, mb, i).then(r => {
        log(`  ↑ sender ${String(i + 1).padStart(2)} sent  ${mb.toFixed(1)} MB  (${r.id})`, 'send');
        return r;
      })
    )
  );

  const sendElapsed = ((performance.now() - t0) / 1000).toFixed(2);
  log(`\nAll ${N_SENDERS} sends enqueued in ${sendElapsed}s — waiting for delivery…`, 'info');

  // Wait for all N_SENDERS to be received (timeout 15 s)
  await new Promise(resolve => {
    const t = setInterval(() => {
      if (receiver.received.length >= N_SENDERS) { clearInterval(t); resolve(); }
    }, 30);
    setTimeout(() => { clearInterval(t); resolve(); }, 15000);
  });

  const totalElapsed = ((performance.now() - t0) / 1000).toFixed(2);

  log('\n─────────────────────────────────────────────', 'head');
  log(`Results  (${totalElapsed}s total)`, 'head');
  log('─────────────────────────────────────────────', 'head');

  let allOk = true;
  for (const r of receiver.received) {
    if (r.ok) {
      log(`  ✅  ${r.id}  ${(r.total / 1024 / 1024).toFixed(2)} MB — intact`, 'pass');
    } else {
      log(`  ❌  ${r.id}  expected ${r.expected}  got ${r.total ?? '?'}  reason: ${r.reason ?? 'size mismatch'}`, 'fail');
      allOk = false;
    }
  }

  const missing = N_SENDERS - receiver.received.length;
  if (missing > 0) {
    log(`  ❌  ${missing} photo(s) never arrived (timeout)`, 'fail');
    allOk = false;
  }

  // ── Abuse-case checks (mirror wall.html DoS hardening) ──────────────────────
  log('\n─────────────────────────────────────────────', 'head');
  log('Abuse cases', 'head');
  log('─────────────────────────────────────────────', 'head');
  allOk = runAbuseChecks() && allOk;

  log('─────────────────────────────────────────────', 'head');
  if (allOk) {
    log(`🟢  SPIKE PASSED — ${N_SENDERS} images, zero dropped, zero corrupt, all abuse cases rejected`, 'pass');
  } else {
    log('🔴  SPIKE FAILED — see above', 'fail');
  }

  document.getElementById('run-btn').disabled = false;
}
</script>
</body>
</html>
